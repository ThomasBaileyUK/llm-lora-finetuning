# LoRA on Qwen3-0.6B in 16-bit. Fits a free Colab T4 (16 GB) with lots of headroom;
# ~5–10 minutes on the sample dataset.
model:
  name: Qwen/Qwen3-0.6B
  dtype: auto          # bf16 on A100/L4, fp16 on T4, fp32 on CPU
  quantization: none

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

data:
  train: data/recruiter_assistant/train.jsonl
  eval: data/recruiter_assistant/eval.jsonl
  system_prompt: >-
    You are a sharp, candid assistant for a technical recruiter who specialises in applied-AI engineering roles (forward deployed engineers, product engineers, AI engineers). Be concise, practical and accurate. Use plain British English.

train:
  output_dir: outputs/qwen3-0.6b-lora
  num_train_epochs: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.05
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 2
  max_length: 1024
  assistant_only_loss: true
  logging_steps: 2
  eval_steps: 10
  save_steps: 100
