# Bigger run on a public Hugging Face dataset. Needs a ~24 GB GPU (A10G, L4, RTX 4090, A100).
model:
  name: Qwen/Qwen3-8B
  dtype: auto
  quantization: 4bit

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: all-linear

data:
  train: trl-lib/Capybara      # multi-turn conversations in "messages" format
  train_split: train
  eval_fraction: 0.02         # hold out 2% for evaluation
  max_train_samples: 5000
  max_eval_samples: 200

train:
  output_dir: outputs/qwen3-8b-qlora-capybara
  num_train_epochs: 1
  learning_rate: 1.0e-4
  warmup_steps: 0.03
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  max_length: 2048
  packing: false
  assistant_only_loss: true
  logging_steps: 10
  eval_steps: 100
  save_steps: 200
  report_to: none
