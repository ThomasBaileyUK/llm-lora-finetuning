# Runs anywhere (even a laptop CPU) in a few minutes. Proves the pipeline works end to end;
# the model is too small for useful results.
model:
  name: HuggingFaceTB/SmolLM2-135M-Instruct
  dtype: auto
  quantization: none

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: all-linear

data:
  train: data/recruiter_assistant/train.jsonl
  eval: data/recruiter_assistant/eval.jsonl
  system_prompt: >-
    You are a sharp, candid assistant for a technical recruiter who specialises in applied-AI engineering roles (forward deployed engineers, product engineers, AI engineers). Be concise, practical and accurate. Use plain British English.

train:
  output_dir: outputs/smoke-test
  max_steps: 10
  learning_rate: 2.0e-4
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  max_length: 512
  # SmolLM2's chat template has no generation markers, so learn from the full conversation here.
  assistant_only_loss: false
  gradient_checkpointing: false
  logging_steps: 1
  eval_steps: 5
  save_steps: 1000
